<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}

body {
    height: 100vh;
    display: flex;
    background: linear-gradient(135deg, #e0e7ff, #f8fafc);
}

/* Sidebar */
.sidebar {
    width: 260px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.6);
    padding: 20px;
    border-right: 1px solid rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
}

.sidebar h3 {
    margin-bottom: 15px;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
}

.user {
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.user:hover {
    background: rgba(10,132,255,0.1);
}

.dot {
    width: 8px;
    height: 8px;
    background: #34c759;
    border-radius: 50%;
    flex-shrink: 0;
}

/* Main Chat */
.chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-header {
    padding: 18px 20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.7);
    border-bottom: 1px solid rgba(0,0,0,0.05);
    font-weight: 500;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.connection-status {
    font-size: 12px;
    font-weight: 400;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(52,199,89,0.15);
    color: #1a7a32;
}

.connection-status.disconnected {
    background: rgba(255,69,58,0.12);
    color: #c0392b;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.bubble {
    max-width: 60%;
    padding: 12px 18px;
    border-radius: 20px;
    margin-bottom: 10px;
    animation: fadeIn 0.2s ease-in-out;
    word-break: break-word;
}

.bubble.left {
    background: #f1f1f1;
    align-self: flex-start;
}

.bubble.right {
    background: #0A84FF;
    color: white;
    align-self: flex-end;
}

.bubble-sender {
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 4px;
    opacity: 0.6;
}

.input-area {
    padding: 15px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.7);
    display: flex;
    gap: 10px;
    border-top: 1px solid rgba(0,0,0,0.05);
}

.input-area input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 20px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.9);
    font-size: 14px;
}

.input-area input:focus {
    box-shadow: 0 0 0 2px rgba(10,132,255,0.3);
}

.input-area button {
    padding: 12px 20px;
    border-radius: 20px;
    border: none;
    background: #0A84FF;
    color: white;
    cursor: pointer;
    transition: 0.2s;
    font-size: 14px;
    font-weight: 500;
}

.input-area button:hover {
    transform: scale(1.05);
    background: #0070e0;
}

/* Mini Chats */
#mini-chats-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 15px;
    align-items: flex-end;
    flex-wrap: wrap-reverse;
    max-width: calc(100vw - 300px);
}

.mini-chat {
    width: 280px;
    height: 350px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.92);
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: fadeIn 0.2s ease-in-out;
    border: 1px solid rgba(0,0,0,0.06);
}

.mini-header {
    padding: 12px 14px;
    font-weight: 600;
    font-size: 14px;
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mini-close {
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: #999;
    padding: 0 2px;
    transition: color 0.15s;
}

.mini-close:hover { color: #333; }

.mini-messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.mini-bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 13px;
    word-break: break-word;
    animation: fadeIn 0.15s ease;
}

.mini-bubble.left {
    background: #f1f1f1;
    align-self: flex-start;
}

.mini-bubble.right {
    background: #0A84FF;
    color: white;
    align-self: flex-end;
}

.mini-input {
    display: flex;
    padding: 10px;
    gap: 6px;
    border-top: 1px solid rgba(0,0,0,0.06);
}

.mini-input input {
    flex: 1;
    padding: 8px 12px;
    border-radius: 15px;
    border: 1px solid rgba(0,0,0,0.1);
    outline: none;
    font-size: 13px;
    background: #fafafa;
}

.mini-input input:focus {
    border-color: #0A84FF;
}

.mini-input button {
    padding: 8px 13px;
    border-radius: 15px;
    border: none;
    background: #0A84FF;
    color: white;
    cursor: pointer;
    font-size: 13px;
    transition: 0.15s;
}

.mini-input button:hover { background: #0070e0; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>Online</h3>
    <div id="active-users"></div>
</div>

<div class="chat-container">
    <div class="chat-header">
        <span id="header-username">Chat</span>
        <span class="connection-status" id="conn-status">Connected</span>
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message...">
        <button id="send-btn">Send</button>
    </div>
</div>

<div id="mini-chats-container"></div>

<!-- Username passed from server via template, or extracted from URL -->
<script>
    // Extract username from URL path: /chat/<username>
    window.currentUser = decodeURIComponent(window.location.pathname.split("/chat/")[1] || "");
</script>
<script src="/static/script.js"></script>

</body>
</html>
