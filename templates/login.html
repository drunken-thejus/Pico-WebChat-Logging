<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pico Chat</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}

body {
    height: 100vh;
    background: radial-gradient(circle at 20% 20%, #1e1b4b, #0f172a 60%, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

.brand {
    position: absolute;
    top: 30px;
    left: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.8;
}

.brand-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.card {
    width: 380px;
    padding: 50px 40px;
    border-radius: 28px;
    backdrop-filter: blur(40px);
    background: rgba(255,255,255,0.05);
    box-shadow:
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 0 0 1px rgba(255,255,255,0.08);
    text-align: center;
    animation: fadeUp 0.6s ease;
}

.card h1 {
    font-size: 32px;
    margin-bottom: 10px;
    font-weight: 600;
}

.card p {
    font-size: 15px;
    opacity: 0.7;
    margin-bottom: 35px;
}

.input-group {
    position: relative;
    margin-bottom: 12px;
}

.input-group input {
    width: 100%;
    padding: 16px 18px;
    border-radius: 16px;
    border: none;
    outline: none;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 15px;
    transition: 0.3s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
}

.input-group input::placeholder {
    color: rgba(255,255,255,0.3);
}

.input-group input:focus {
    box-shadow:
        0 0 0 2px #0A84FF,
        0 0 20px rgba(10,132,255,0.4);
}

/* Inline validation message */
.validation-msg {
    font-size: 12px;
    color: #ff6b6b;
    text-align: left;
    padding: 4px 6px 10px;
    display: none;
}

.validation-msg.visible {
    display: block;
}

button {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #0A84FF, #0066ff);
    color: white;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.25s ease;
    box-shadow: 0 10px 25px rgba(10,132,255,0.4);
    margin-top: 6px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(10,132,255,0.6);
}

.members {
    margin-top: 30px;
    font-size: 14px;
    opacity: 0.7;
}

.footer {
    position: absolute;
    bottom: 25px;
    text-align: center;
    width: 100%;
    font-size: 13px;
    opacity: 0.5;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="brand">
    <div class="brand-icon">💬</div>
    <div>Pico Chat</div>
</div>

<div class="card">
    <h1>Welcome</h1>
    <p>Join the conversation</p>

    <div class="input-group">
        <input type="text" id="username" placeholder="Username" maxlength="20" autocomplete="off">
    </div>
    <div class="validation-msg" id="validation-msg"></div>

    <button onclick="goToChat()">Continue</button>

    <div class="members">
        <span id="active-users-num">Loading...</span> members online
    </div>
</div>

<div class="footer">
    Privacy &middot; Terms &middot; Support
</div>

<script>
async function loadActiveUserCount() {
    try {
        const response = await fetch("/active-users-count");
        const result = await response.json();
        document.getElementById("active-users-num").innerText = result.data.count;
    } catch {
        document.getElementById("active-users-num").innerText = "0";
    }
}

loadActiveUserCount();
setInterval(loadActiveUserCount, 3000);

function showError(msg) {
    const el = document.getElementById("validation-msg");
    el.innerText = msg;
    el.classList.add("visible");
}

function clearError() {
    document.getElementById("validation-msg").classList.remove("visible");
}

function goToChat() {
    const username = document.getElementById("username").value.trim();

    if (!username) {
        showError("Please enter a username.");
        return;
    }

    // Only allow letters, numbers, underscores — 2 to 20 chars
    if (!/^[a-zA-Z0-9_]{2,20}$/.test(username)) {
        showError("2–20 characters. Letters, numbers, and underscores only.");
        return;
    }

    clearError();
    window.location.href = `/chat/${encodeURIComponent(username)}`;
}

document.getElementById("username").addEventListener("keypress", function(e) {
    if (e.key === "Enter") goToChat();
});

document.getElementById("username").addEventListener("input", clearError);
</script>

</body>
</html>
